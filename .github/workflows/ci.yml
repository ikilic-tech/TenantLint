name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/TenantLint.Package/TenantLint.Package.csproj --configuration Release --no-build --output ./artifacts

      - name: Build sample and verify diagnostics
        shell: bash
        working-directory: samples/SampleSaaS
        run: |
          dotnet build SampleSaaS.csproj --configuration Release 2>&1 | tee sample-build.log
          MISSING=0
          for id in TL001 TL002 TL003 TL005; do
            if ! grep -q "warning ${id}:" sample-build.log; then
              echo "FAIL: Expected diagnostic ${id} not found in sample build output"
              MISSING=1
            fi
          done
          if [ $MISSING -ne 0 ]; then exit 1; fi
          echo "All expected diagnostics found in sample build output."

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./artifacts/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Pack
        run: dotnet pack src/TenantLint.Package/TenantLint.Package.csproj --configuration Release --no-build --output ./artifacts

      - name: Login to NuGet (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ./artifacts/*.nupkg
